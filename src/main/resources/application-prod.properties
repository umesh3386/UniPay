# ===============================
# APP CONFIG
# ===============================

spring.application.name=Unipay_1
server.port=${PORT:8080}

# ===============================
# DATABASE (PostgreSQL)
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ===============================
# SSL (Required for hosted PostgreSQL)
# ===============================

spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# ===============================
# HIBERNATE
# ===============================

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===============================
# FIREBASE
# ===============================

app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}
app.firebase.api-key=${FIREBASE_API_KEY}

# ===============================
# JWT CONFIG
# ===============================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ===============================
# RAZORPAY
# ===============================

razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}

# ===============================
# PAYMENT CONSTRAINTS
# ===============================

app.payment.tap.min-amount=1.00
app.payment.tap.max-amount=5000.00

# ===============================
# CORS
# ===============================
# Set ALLOWED_ORIGINS in your production environment / hosting dashboard (e.g. Railway)
# Format: comma-separated origins, e.g. https://your-app.railway.app,https://yourdomain.com
app.cors.allowed-origins=${ALLOWED_ORIGINS}
