spring.application.name=Unipay_1
server.port=8080

# ===============================
# DATABASE (PostgreSQL)
# ===============================
# For local development, configure your PostgreSQL instance below.
# For production, use environment variables (see application-prod.properties).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unipay_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FIREBASE
# ===============================
# Paste the full Firebase Service Account JSON as a single-line string,
# or set FIREBASE_SERVICE_ACCOUNT env variable.
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT}
app.firebase.api-key=${FIREBASE_API_KEY}

# ===============================
# JWT CONFIG
# ===============================
# Base64-encoded 256-bit secret key for signing JWTs.
# Generate one: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ===============================
# RAZORPAY
# ===============================
razorpay.api.key=${RAZORPAY_KEY}
razorpay.api.secret=${RAZORPAY_SECRET}

# ===============================
# PAYMENT CONSTRAINTS
# ===============================
app.payment.tap.min-amount=1.00
app.payment.tap.max-amount=5000.00