name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test

      # These must be configured in your GitHub repository secrets.
      # See README.md → "CI/CD Setup" for instructions.
      DB_URL: ${{ secrets.DB_URL }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
      RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and run tests
        run: mvn clean install

      - name: Start PostgreSQL container for smoke test
        run: docker run -d --name smoke-postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=unipay_db postgres:16-alpine

      - name: Smoke Test — Health Check
        run: |
          java -Dspring.profiles.active=test -jar target/unipay-backend-1.0.0.jar &
          APP_PID=$!
          echo "Waiting for application to start (PID: $APP_PID)..."
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Smoke test PASSED: Application is UP (HTTP $HTTP_STATUS) ✅"
              kill $APP_PID
              exit 0
            fi
            echo "Waiting for app to become healthy... attempt $i/30 (status: $HTTP_STATUS)"
            sleep 2
          done
          echo "Smoke test FAILED: Application did not respond with 200 within timeout ❌"
          kill $APP_PID || true
          exit 1
