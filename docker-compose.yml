services:
  db:
    image: postgres:15-alpine
    container_name: unipay-db
    environment:
      POSTGRES_DB: unipay_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - unipay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unipay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: unipay-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/unipay_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unipay-network

volumes:
  pgdata:

networks:
  unipay-network:
    driver: bridge